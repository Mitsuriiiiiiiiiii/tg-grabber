name: build

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: >
          pip install requests telethon pyinstaller
          "git+https://github.com/thedemons/opentele.git"

      - name: build
        run: >
          pyinstaller --onefile --noconsole --clean
          --name TelegramBackup --icon icon.ico
          --collect-all opentele --collect-all telethon
          grabber.py

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/TelegramBackup.exe
