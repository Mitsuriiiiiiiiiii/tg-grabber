name: build

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: TelegramBackup.exe
            icon: --icon icon.ico
            out: dist/TelegramBackup.exe
          - os: macos-latest
            name: TelegramBackup-mac
            icon: ""
            out: dist/TelegramBackup-mac
          - os: ubuntu-latest
            name: TelegramBackup-linux
            icon: ""
            out: dist/TelegramBackup-linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: deps
        run: >
          pip install requests telethon pyinstaller
          "git+https://github.com/thedemons/opentele.git"

      - name: build
        run: >
          pyinstaller --onefile --noconsole --clean
          --name ${{ matrix.name }} ${{ matrix.icon }}
          --collect-all opentele --collect-all telethon
          grabber.py

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
